# Build the documentation with `axlib md2html` (make docs) and publish it to
# GitHub Pages, https://robert-patrick-texas.github.io/axlib/.  The release
# workflow (release.yml) calls this as its last job, so the pages are built
# from the release's tag and describe that release.  (A release created by a
# workflow does not trigger other workflows, so this cannot simply run on
# "release published".)  "Run workflow" on the Actions tab publishes again by
# hand, from the branch or tag chosen there.
#
# Actions are pinned to full commit hashes (the version is in the comment), so
# a moved tag cannot change what runs with permission to deploy the site.
name: Publish documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits rather than cancelling a
# deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build the site with axlib md2html
        # GITHUB_REF_NAME is the release tag (or the branch of a manual run);
        # each page's footer links to its Markdown source at that ref.
        run: make docs DOCS_REF="$GITHUB_REF_NAME"
      # The pages link to each other with relative URLs, so the site needs no
      # base URL from actions/configure-pages and works at any path.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
