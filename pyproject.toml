[project]
name = "axlib"
version = "1.0.0"
description = "Educational Python tools and library helpers for Network Operations automation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [
    { name = "Robert Patrick", email = "rob-axlib@rpatrick.com" },
]
keywords = [
    "network",
    "automation",
    "netops",
    "text-processing",
    "credentials",
    "sqlite",
    "aes-gcm",
    "redis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=42",
    "redis>=5",
]

[project.scripts]
axlib = "axlib.__main__:main"
axlib-credential-file = "axlib.credentials.file_cli:main"
axlib-credential-db = "axlib.credentials.sqlite_cli:main"
axlib-tf = "axlib.tf.__main__:main"
axlib-tf-include = "axlib.tf.incfile:main"
axlib-tf-comments = "axlib.tf.rmcomment:main"
axlib-tf-slash-comments = "axlib.tf.rmdouble:main"
axlib-tf-triple-quotes = "axlib.tf.rmtriple:main"
axlib-tf-lines = "axlib.tf.rmline:main"
axlib-tf-whitespace = "axlib.tf.rmwhite:main"
axlib-tf-whitespace-safe = "axlib.tf.rmwhite2:main"
axlib-tf-variables = "axlib.tf.varsub:main"

[project.urls]
Homepage = "https://github.com/robert-patrick-texas/axlib"
Repository = "https://github.com/robert-patrick-texas/axlib"
Documentation = "https://github.com/robert-patrick-texas/axlib"
Issues = "https://github.com/robert-patrick-texas/axlib/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12",
    "ty>=0.0.1a16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axlib = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--maxfail=1", "--cov=axlib", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
cache-dir = "/dev/shm/.cache/ruff"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ARG001",
    "C901",
    "COM812",
    "D",
    "ERA001",
    "FBT001",
    "FBT002",
    "FURB110",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW2901",
    "PT011",
    "S101",
    "T201",
    "TC",
]
