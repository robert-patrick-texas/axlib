[project]
name = "axlib"
version = "1.0.10"
description = "Educational Python tools and library helpers for Network Operations automation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [
    { name = "Robert Patrick", email = "rob-axlib@rpatrick.com" },
]
keywords = [
    "network",
    "tui",
    "automation",
    "netops",
    "text-processing",
    "credentials",
    "sqlite",
    "aes-gcm",
    "redis",
    "radius",
    "textfsm",
    "parsing",
    "markdown",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=50.0.2",
    "redis>=8.1.0",
]

[project.scripts]
axlib = "axlib.__main__:main"
axlib-credential-file = "axlib.credentials.file_cli:main"
axlib-credential-db = "axlib.credentials.sqlite_cli:main"
axlib-credential-tui = "axlib.credentials.tui:main"
axlib-netenv-set = "axlib.credentials.netenv:set_main"
axlib-netenv-clear = "axlib.credentials.netenv:clear_main"
axlib-radius = "axlib.radius:main"
axlib-parse = "axlib.parse.__main__:main"
axlib-md2html = "axlib.md2html.__main__:main"
axlib-tf = "axlib.tf.__main__:main"
axlib-tf-include = "axlib.tf.incfile:main"
axlib-tf-comments = "axlib.tf.rmcomment:main"
axlib-tf-slash-comments = "axlib.tf.rmdouble:main"
axlib-tf-triple-quotes = "axlib.tf.rmtriple:main"
axlib-tf-lines = "axlib.tf.rmline:main"
axlib-tf-whitespace = "axlib.tf.rmwhite:main"
axlib-tf-whitespace-safe = "axlib.tf.rmwhite2:main"
axlib-tf-variables = "axlib.tf.varsub:main"

[project.urls]
Homepage = "https://github.com/robert-patrick-texas/axlib"
Repository = "https://github.com/robert-patrick-texas/axlib"
Documentation = "https://robert-patrick-texas.github.io/axlib/"
Issues = "https://github.com/robert-patrick-texas/axlib/issues"

[project.optional-dependencies]
# `axlib md2html`: markdown-it-py (CommonMark plus GitHub's tables and
# strikethrough) with linkify-it-py, which turns bare URLs into links, and
# mdit-py-plugins for GitHub's task-list check boxes and footnotes.
markdown = [
    "markdown-it-py[linkify]>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]
# `axlib parse`: the TextFSM engine plus the ntc-templates collection of
# ~1,000 community templates for show commands on many vendors' devices.
textfsm = [
    "ntc-templates>=9.3.0",
    "textfsm>=2.1.0",
]
tui = [
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    # Developers always get every optional extra, so `ty` can check and pytest
    # can exercise axlib.credentials.tui and axlib.parse after a plain `uv sync`.
    "axlib[markdown,textfsm,tui]",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    # Pinned exactly: `select = ["ALL"]` in [tool.ruff.lint] means every ruff
    # release can add newly stabilized rules, so ruff changes only through
    # `make deps`, which moves the pin to the newest release when make check
    # passes with it and holds it otherwise (docs/DEVELOPMENT.md, "Dependencies").
    "ruff==0.17.3",
    "ty>=0.0.93",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axlib = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--maxfail=1", "--cov=axlib", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
cache-dir = "/dev/shm/.cache/ruff"
# The extensionless uv launchers in scripts/ are Python and are linted too.
extend-include = ["scripts/netenv-set", "scripts/netenv-clear"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ARG001",
    # Test doubles and Protocol implementations intentionally leave interface
    # parameters (e.g. `service`, `fields`) unused; matches ARG001 above.
    "ARG002",
    "C901",
    "COM812",
    "D",
    "ERA001",
    "FBT001",
    "FBT002",
    "FURB110",
    "PLR0912",
    # CLI dispatch functions (file_cli.py/sqlite_cli.py `main`) intentionally
    # use one early return per subcommand branch; matches PLR0912/PLR0915.
    "PLR0911",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    # config.py is an intentional legacy module-level settings facade
    # (`import axlib.config as config; config.redis_host`, etc.); rebinding
    # those globals from apply_settings() is the point, not an oversight.
    "PLW0603",
    "PLW2901",
    "PT011",
    "S101",
    "T201",
    "TC",
    # This codebase deliberately writes long, specific, operator-facing
    # exception messages inline (CLI/API errors) rather than indirecting
    # through pre-assigned variables or exception subclasses.
    "TRY003",
    "EM101",
    "EM102",
    # __main__.py entry points lazily import optional CLI subcommand modules
    # so unrelated heavy dependencies aren't imported for unrelated commands.
    "PLC0415",
    # The credential stores deliberately re-raise their own exception types
    # unchanged from inside a broader except clause used to translate stdlib
    # exceptions (sqlite3.Error, KeyError, ...); TRY300/TRY301 conflict with
    # that exception-translation idiom.
    "TRY300",
    "TRY301",
]

[tool.ruff.lint.flake8-copyright]
author = "Robert Patrick"

[tool.ruff.lint.per-file-ignores]
# Standalone scripts invoked as `python tools/<script>.py`, not a package.
"tools/*.py" = ["INP001"]
# uv inline-metadata (PEP 723) launchers run as `scripts/netenv-set`; they are
# executables, not importable modules, so hyphenated names are intentional.
"scripts/*" = ["INP001", "N999"]

[tool.uv.sources]
axlib = { workspace = true }
